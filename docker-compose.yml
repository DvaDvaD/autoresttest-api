services:
  # --- DATABASE ---
  postgres:
    image: postgres:13-alpine
    container_name: market-db
    environment:
      POSTGRES_DB: market_prod
      POSTGRES_USER: autorest_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_dev_password_99}
    # Security: Bind only to localhost to prevent external access
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - market-db-data:/var/lib/postgresql/data
    restart: always
    # Reliability: Ensure DB is ready before dependents start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autorest_admin -d market_prod -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Ops: Rotate logs to prevent disk exhaustion
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # --- JAVA APIs ---
  features-api:
    build:
      context: .
      dockerfile: infra/features-api/Dockerfile
      network: host
    container_name: features-api
    ports:
      - "8082:8082"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8082 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  market-api:
    build:
      context: .
      dockerfile: infra/market-api/Dockerfile
      network: host
    container_name: market-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/market_prod
      SPRING_DATASOURCE_USERNAME: autorest_admin
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-secure_dev_password_99}
    ports:
      - "8081:8081"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  countries-api:
    build:
      context: .
      dockerfile: infra/countries-api/Dockerfile
      network: host
    container_name: countries-api
    ports:
      - "8080:8080"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # --- PYTHON MODEL WRAPPER ---
  model-wrapper-api:
    build:
      context: .
      dockerfile: infra/model-wrapper-api/Dockerfile
      network: host
    container_name: model-wrapper
    volumes:
      - ./models_store:/app/models_store:ro
    ports:
      - "8000:8080"
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import urllib.request; urllib.request.urlopen("http://localhost:8080/openapi.json")'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

volumes:
  market-db-data:

# Network: Explicitly define subnet to avoid conflict with default bridge (172.17.0.0/16)
networks:
  default:
    ipam:
      driver: default
      config:
        - subnet: "172.25.0.0/16"